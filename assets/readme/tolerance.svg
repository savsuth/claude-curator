<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Why an equal score is not enough</title>
  <desc id="desc">Two offline fixture results on a number line of candidate score minus original score. With tolerance -0.05, the preserves scenario has bounds -0.042 to +0.042, fully above the tolerance, so the verdict is simplify. The limited-evidence scenario has estimate -0.042, inside tolerance, but bounds -0.097 to 0.000 cross it, so the verdict is inconclusive.</desc>
  <rect width="1200" height="420" rx="24" fill="#0E1116"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="62" font-size="22" fill="#C9CDD3">Candidate score minus original score, mean over 8 held-out cases</text>
    <text x="60" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B929C">offline fixture data, examples/changelog-writer</text>

    <rect x="160" y="112" width="376" height="236" fill="#F0883E" fill-opacity="0.06"/>
    <line x1="536" y1="112" x2="536" y2="348" stroke="#F0883E" stroke-width="3"/>
    <text x="548" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#F0883E">tolerance -0.05</text>
    <line x1="724" y1="150" x2="724" y2="348" stroke="#2A313B" stroke-width="2" stroke-dasharray="6 6"/>

    <g id="row-simplify">
      <text x="160" y="178" font-size="20" fill="#F2EEE6">Section removed, results unchanged</text>
      <line x1="566" y1="204" x2="882" y2="204" stroke="#F2EEE6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="724" cy="204" r="9" fill="#0E1116" stroke="#F2EEE6" stroke-width="4"/>
      <text x="1110" y="210" font-size="22" font-weight="700" fill="#F2EEE6" text-anchor="end">simplify</text>
      <text x="566" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B929C">bounds -0.042 to +0.042</text>
    </g>

    <g id="row-inconclusive">
      <text x="160" y="276" font-size="20" fill="#F2EEE6">Small observed drop, noisy evidence</text>
      <line x1="359" y1="302" x2="724" y2="302" stroke="#C9CDD3" stroke-width="6" stroke-linecap="round"/>
      <circle cx="566" cy="302" r="9" fill="#0E1116" stroke="#C9CDD3" stroke-width="4"/>
      <text x="1110" y="308" font-size="22" font-weight="700" fill="#C9CDD3" text-anchor="end">inconclusive</text>
      <text x="742" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B929C">bounds -0.097 to 0.000</text>
    </g>

    <line x1="160" y1="348" x2="1100" y2="348" stroke="#8B929C" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B929C" text-anchor="middle">
      <text x="160" y="380">-0.15</text>
      <text x="348" y="380">-0.10</text>
      <text x="724" y="380">0</text>
      <text x="912" y="380">+0.05</text>
      <text x="1100" y="380">+0.10</text>
    </g>
  </g>
</svg>
